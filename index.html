<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EzCheats</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f13;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .hero {
            background: rgba(255, 255, 255, 0.03);
            padding: 60px 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
        }
        #logo {
            width: 128px;
            height: 128px;
            border-radius: 25%;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            object-fit: cover;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 15px 0;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .download-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(10px);
        }
        .download-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="assets/EzCheats.png" alt="EzCheats [REMAKE] Logo" id="logo" onerror="this.src='https://via.placeholder.com/128?text=EzC'">
        <h1>EzCheats</h1>
        <p>Premium Chromium browser extension.</p>
        <a href="EzCheats_Extension.zip" class="download-btn">Download .zip</a>
    </div>
</body>
</html>
